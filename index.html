<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LOCKIN</title>
   <!-- PWA Meta Tags -->
   <link rel="manifest" href="manifest.json">
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="default">
   <meta name="apple-mobile-web-app-title" content="LOCKEDIN">
   <link rel="apple-touch-icon" href="LOCKEDIN.png">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
/* Global Styles */
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5faff;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #007BFF;
      font-size: 2em;
      margin-bottom: 20px;
    }

    input,
    button,
    select {
      padding: 10px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      width: 100%;
      box-sizing: border-box;
    }

    #chat,
    #agreement {
      max-width: 600px;
      width: 100%;
      margin-top: 20px;
    }

    #messages {
      height: 300px;
      overflow-y: scroll;
      border: 1px solid #ccc;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
    }

    /* Suggestion Section */
    .suggestion-section {
      margin-top: 30px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
    }

    .suggestion-section h2 {
      color: #007BFF;
      font-size: 1.2em;
      margin-bottom: 15px;
    }

    .suggestion {
      font-size: 1.1em;
      color: #007BFF;
      cursor: pointer;
      padding: 8px 12px;
      margin: 8px 0;
      background-color: #f1f9ff;
      border: 1px solid #007BFF;
      border-radius: 6px;
      transition: background-color 0.3s, transform 0.2s;
    }

    .suggestion:hover {
      background-color: #007BFF;
      color: white;
      transform: scale(1.05);
    }

    .suggestion:active {
      background-color: #0056b3;
      transform: scale(1);
    }

    /* Layout Adjustments */
    #setup,
    #agreement,
    #chat {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    #setup input,
    #setup select {
      width: 100%;
    }

    #msg {
      width: 80%;
      margin-right: 10px;
    }

    #roomHeader {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #007BFF;
    }

    #messages {
      margin-top: 15px;
      padding: 15px;
      background-color: #fff;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    /* Button Styles */
    button {
      width: 100%;
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Responsive Design: Adjusting for mobile and tablet views */

    /* For Mobile (screen width <= 600px) */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .suggestion-section {
        padding: 15px;
      }

      .suggestion {
        font-size: 1em;
        padding: 6px 10px;
      }

      #msg {
        width: 70%;
      }

      button {
        padding: 12px;
      }
    }

    /* For Tablets (screen width <= 768px) */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.9em;
      }

      .suggestion-section {
        padding: 18px;
      }

      .suggestion {
        font-size: 1.1em;
        padding: 7px 11px;
      }

      #msg {
        width: 75%;
      }

      button {
        padding: 14px;
      }
    }

    /* For Larger Screens (screen width > 768px) */
    @media (min-width: 769px) {
      .suggestion-section {
        width: 80%;
      }

      .suggestion {
        font-size: 1.1em;
        padding: 8px 12px;
      }
    }

    /* For Extra Large Screens (screen width > 1200px) */
    @media (min-width: 1200px) {
      .suggestion-section {
        width: 60%;
      }

      h1 {
        font-size: 2.2em;
      }

      .suggestion {
        font-size: 1.2em;
        padding: 9px 14px;
      }

      #msg {
        width: 85%;
      }

      button {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

<h1>🔐 LOCKEDIN</h1>

<div id="setup">
  <input id="username" placeholder="Username (or leave blank for anonymous)" />
  <input id="roomName" placeholder="Room name" />
  <select id="roomType">
    <option value="public">Public</option>
    <option value="private">Private</option>
  </select>
  <input id="roomPassword" placeholder="Password (if private)" type="password" />
  <button onclick="checkAgreement()">Join Room</button>

  <div id="suggestions" style="margin-top: 20px;">
    <p><strong>Suggested Room Types:</strong></p>
    <p class="suggestion" onclick="setRoomSuggestion('Politics')">Politics Room</p>
    <p class="suggestion" onclick="setRoomSuggestion('Gaming')">Gaming Room</p>
    <p class="suggestion" onclick="setRoomSuggestion('Tech')">Tech Room</p>
    <p class="suggestion" onclick="setRoomSuggestion('Sports')">Sports Room</p>
    <p class="suggestion" onclick="setRoomSuggestion('Movies')">Movies Room</p>
  </div>
</div>

<div id="agreement" style="display:none;">
  <h3>Terms of Use</h3>
  <p>
    By clicking "Accept", you agree that anything sent in the chat is 100% your responsibility. This app and its creators are not responsible for any content shared by users.
  </p>
  <button onclick="createOrJoinRoom()">Accept & Continue</button>
</div>

<div id="chat" style="display:none;">
  <h2 id="roomHeader"></h2>
  <div id="messages"></div>
  <input id="msg" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAe0j-iB4gapzSq1zy2a6j4kwaET8JXZ_8",
  authDomain: "nopeeking-e272a.firebaseapp.com",
  databaseURL: "https://nopeeking-e272a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nopeeking-e272a",
  storageBucket: "nopeeking-e272a.firebasestorage.app",
  messagingSenderId: "193204663242",
  appId: "1:193204663242:web:46523ab13715b022b09533",
  measurementId: "G-BM1EF4526F"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentRoom = "";
let currentUser = "";
let safeMode = false;

function checkAgreement() {
  currentUser = document.getElementById("username").value.trim();
  if (!currentUser) {
    currentUser = "Anon" + Math.floor(Math.random() * 1000);
    safeMode = true;
  }
  document.getElementById("setup").style.display = "none";
  document.getElementById("agreement").style.display = "block";
}

function createOrJoinRoom() {
  const room = document.getElementById("roomName").value.trim();
  const type = document.getElementById("roomType").value;
  const pass = document.getElementById("roomPassword").value;

  if (!room) return alert("Enter a room name");

  const roomRef = db.ref("rooms/" + room);
  roomRef.once("value", snapshot => {
    const data = snapshot.val();
    if (data) {
      if (data.type === "private" && data.password !== pass) {
        return alert("Wrong password!");
      }
    } else {
      roomRef.set({ type, password: type === "private" ? pass : "" });
    }

    currentRoom = room;
    document.getElementById("agreement").style.display = "none";
    document.getElementById("chat").style.display = "block";
    document.getElementById("roomHeader").innerText = `Room: ${room} (${type}) | User: ${currentUser}`;
    listenForMessages(room);
  });
}

function setRoomSuggestion(suggestedRoom) {
  document.getElementById("roomName").value = suggestedRoom;
}

function sendMessage() {
  let text = document.getElementById("msg").value.trim();
  if (!text || !currentRoom) return;

  // Safe Mode for anonymous users only (word filtering)
  if (safeMode) {
    const badWords = ["badword", "worseword", "hell", "damn", "Buying drugs", "Selling weed", "Drug deals", "Drug trafficking", "cocaine", "meth", "heroin", "Kill", "Shoot", "Hurt", "Stab", "Bomb", "Explosive device","Assassinate", "Attack", "Fight", "Gang violence", "Firearms", "Unregistered gun", "Weapon dealing", "Bomb-making", "Homemade weapons", "Assault rifles", "Shooting range","Child pornography", "Sex trafficking", "Prostitution", "Grooming","Hack", "Phishing", "Doxxing", "DDoS", "Cyber attack", "Identity theft","Malware", "Spyware", "Trojan", "Keylogger", "Crack software","Kidnap", "Human trafficking", "Slavery", "Abduction", "Smuggling","Organ trade", "Sex trade", "Slave labor", "Money laundering", "Bank fraud", "Wire fraud", "Counterfeit money","Ponzi scheme", "Investment fraud", "Tax evasion", "Credit card fraud","Illegal casino", "Underground gambling", "Match-fixing","Unlicensed betting", "Illegal poker games", "Betting ring", "Spy on", "Surveillance camera hacking", "Hidden camera", "Phone tapping", "Stalking", "Harassment", "Invading privacy", "Pirated software", "Illegal downloads", "Counterfeit goods", "Black market", "Drug smuggling", "Pirated movies", "Illegal imports", "Terrorism", "Terrorist attack", "Extremist group", "Radicalization", "Bomb threat", "Suicide bomb", "Martyrdom", "Stalk", "Cyberbullying", "Harassment", "Threaten", "Blackmail", "Intimidation", "Exploitation", "Animal abuse", "Dog fighting", "Animal trafficking", "Poaching","Illegal pet trade",];  
    // Regex to check for whole words (case insensitive)
    const regex = new RegExp(`\\b(${badWords.join("|")})\\b`, "i");
    if (regex.test(text)) {
      alert("Message blocked due to Safe Mode (contains restricted words).");
      return;
    }
  }

  // Send message to Firebase
  db.ref("messages/" + currentRoom).push({
    name: currentUser,
    text,
    timestamp: Date.now()
  });

  // Clear the message input field
  document.getElementById("msg").value = "";
}

function listenForMessages(room) {
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  db.ref("messages/" + room).on("child_added", snapshot => {
    const msg = snapshot.val();
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${msg.name}:</b> ${msg.text}`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}
</script>

</body>
</html>
