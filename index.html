<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKEDIN</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f5faff;
      text-align: center;
    }

    h1 {
      color: #007BFF;
    }

    input, button, select {
      width: 90%;
      max-width: 400px;
      margin: 8px auto;
      padding: 12px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: block;
    }

    button {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    button:hover {
      background-color: #0056b3;
    }

    #messages {
      max-width: 400px;
      height: 250px;
      margin: 15px auto;
      overflow-y: auto;
      background: white;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }

    .suggestion {
      background: #e0f0ff;
      color: #007BFF;
      margin: 5px auto;
      padding: 10px;
      max-width: 400px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #007BFF;
    }

    .suggestion:hover {
      background: #007BFF;
      color: white;
    }

    #msg {
      width: 70%;
    }

    #googleBtn {
      background: #db4437;
    }

    @media (max-width: 480px) {
      #msg {
        width: 60%;
      }
    }
  </style>
</head>
<body>
  <h1>🔐 LOCKEDIN</h1>

  <div id="setup">
    <button id="googleBtn" onclick="loginWithGoogle()">Sign in with Google</button>
    <input id="username" placeholder="Or type username (optional)" />
    <input id="roomName" placeholder="Room name" />
    <select id="roomType">
      <option value="public">Public</option>
      <option value="private">Private</option>
    </select>
    <input id="roomPassword" placeholder="Password (if private)" type="password" />
    <button onclick="checkAgreement()">Join Room</button>

    <p><strong>Suggestions:</strong></p>
    <div class="suggestion" onclick="setRoomSuggestion('Politics')">Politics</div>
    <div class="suggestion" onclick="setRoomSuggestion('Gaming')">Gaming</div>
    <div class="suggestion" onclick="setRoomSuggestion('Tech')">Tech</div>
    <div class="suggestion" onclick="setRoomSuggestion('Sports')">Sports</div>
    <div class="suggestion" onclick="setRoomSuggestion('Movies')">Movies</div>
  </div>

  <div id="agreement" style="display:none;">
    <h3>Terms of Use</h3>
    <p>By clicking Accept, you agree you are responsible for your messages. LOCKEDIN is not liable for content shared by users.</p>
    <button onclick="createOrJoinRoom()">Accept & Continue</button>
  </div>

  <div id="chat" style="display:none;">
    <h2 id="roomHeader"></h2>
    <div id="messages"></div>
    <input id="msg" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAe0j-iB4gapzSq1zy2a6j4kwaET8JXZ_8",
      authDomain: "nopeeking-e272a.firebaseapp.com",
      databaseURL: "https://nopeeking-e272a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nopeeking-e272a",
      storageBucket: "nopeeking-e272a.appspot.com",
      messagingSenderId: "193204663242",
      appId: "1:193204663242:web:46523ab13715b022b09533"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentRoom = "";
    let currentUser = "";

    function setRoomSuggestion(name) {
      document.getElementById("roomName").value = name;
    }

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          currentUser = result.user.displayName;
          alert("Signed in as " + currentUser);
          document.getElementById("username").style.display = "none";
        })
        .catch((error) => {
          console.error("Login failed:", error.message);
        });
    }

    function checkAgreement() {
      if (!currentUser) {
        const inputName = document.getElementById("username").value.trim();
        currentUser = inputName || "Anon" + Math.floor(Math.random() * 10000);
      }

      document.getElementById("setup").style.display = "none";
      document.getElementById("agreement").style.display = "block";
    }

    function createOrJoinRoom() {
      const roomName = document.getElementById("roomName").value.trim();
      const password = document.getElementById("roomPassword").value;
      const type = document.getElementById("roomType").value;

      if (!roomName) return alert("Please enter a room name!");
      if (type === "private" && !password) return alert("Private rooms need a password.");

      currentRoom = roomName;
      document.getElementById("roomHeader").innerText = "Room: " + currentRoom;
      document.getElementById("agreement").style.display = "none";
      document.getElementById("chat").style.display = "block";

      loadMessages();
    }

    function sendMessage() {
      const text = document.getElementById("msg").value.trim();
      if (!text) return;
      db.ref(`rooms/${currentRoom}`).push({
        user: currentUser,
        message: text,
        timestamp: Date.now()
      });
      document.getElementById("msg").value = "";
    }

    function loadMessages() {
      const container = document.getElementById("messages");
      db.ref(`rooms/${currentRoom}`).on("value", snap => {
        container.innerHTML = "";
        snap.forEach(child => {
          const data = child.val();
          const msg = document.createElement("div");
          msg.innerHTML = `<strong>${data.user}:</strong> ${data.message}`;
          container.appendChild(msg);
        });
        container.scrollTop = container.scrollHeight;
      });
    }
  </script>
</body>
</html>
